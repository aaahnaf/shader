# ============================================================
#  FastLight Shader - shaders.properties
#  Target: OptiFine H1.4+ / 1.20.x AND Sodium + Iris 1.x (Java Edition)
#
#  DESIGN CONTRACT (this is WHY the FPS does not move):
#   * Zero shadow maps          -> no extra geometry pass, no depth textures
#   * Zero composite passes     -> no full-screen post-processing at all
#   * Zero custom render targets-> framebuffer chain stays exactly vanilla
#   * One texture fetch per fragment for terrain/entities, ZERO for water
#   * All lighting data comes from vanilla vertex attributes (free bandwidth)
#
#  This file deliberately contains NO profiles/, NO program.*.enabled and NO
#  oldLighting=false override: each of those either forces Sodium's deferred
#  path or adds driver edge cases. We stay on the vanilla forward pipeline on
#  both loaders = one identical code path = maximum compatibility, minimum
#  bugs, zero measurable GPU cost beyond a few ALU ops per fragment.
# ============================================================

# ---- Option UI -------------------------------------------------------------
# No sliders, no key bindings, no options: nothing for the user to
# mis-configure into a broken state ("no glitches" holds by construction).
sliders=

# ---- Lighting model ---------------------------------------------------------
# Keep vanilla baked lighting semantics ON (do NOT set oldLighting=false):
# our .fsh re-lights from the same vertex light attributes the game already
# uploads, so chunk rebuilds are never required when switching this pack on.

# ---- Sky / weather: leave every special pass fully vanilla ------------------
sun=true
moon=true
stars=true
sky=true
clouds=vanilla
weather=vanilla

# ---- Water -------------------------------------------------------------------
# Waves are computed in world-*/uncolored.fsh as a pure normal perturbation
# (no geometry displacement -> no popping, no z-fighting). The vanilla
# underwater overlay tint stays enabled so eyes-underwater feels native.
underwaterOverlay=true

# ---- OptiFine compatibility --------------------------------------------------
# IMPORTANT: do NOT set this to false. With oldLighting=false OptiFine stops
# baking light into vertex colours AND stops supplying the at_tma1/tva1 light
# attributes our .fsh reads -> black terrain (classic broken-pack bug).
oldLighting=true

# ---- OptiFine-only hints (safely ignored by Iris) ----------------------------
# Our fragment programs square on input and sqrt on output, i.e. an exact
# gamma-2.0 round trip; declare that so OptiFine does not double-correct.
gammaSettings=2.0

# Do not force fastRenderBuffer/fbo settings: defaults are optimal because we
# allocate no FBOs whatsoever.
